# dem-mosaic config
# Paths, parameters, and per-source metadata. No secrets here (.env for SDE creds).
# Fill in the TODO values before running the notebook.

project:
  name: tahoe-dem-mosaic
  # Runs on the GIS server. Scratch.gdb there is shared, so every intermediate is
  # written with name_prefix so overwriteOutput cannot clobber someone else's work.
  scratch_gdb: C:/GIS/Scratch.gdb
  name_prefix: dm_
  log_file: C:/GIS/dem-mosaic/dem_mosaic.log

# SDE connection files. READ ONLY. Sources are read via Raster.sde, boundaries via
# Vector.sde. Nothing in this project writes to SDE.
sde:
  raster: F:/GIS/DB_CONNECT/Raster.sde
  vector: F:/GIS/DB_CONNECT/Vector.sde

# ---------------------------------------------------------------------------
# Target grid. Everything gets projected + snapped to this before mosaicking.
# ---------------------------------------------------------------------------
target:
  # 26910 = NAD83 / UTM 10N (m): three of four sources are already in it, only the USGS
  # bathy (UTM 11N) gets reprojected.
  wkid: 26910
  # 1 m: the 2022 lidar (0.73 x 0.68 m) cannot honestly support 0.5 m, and the 0.5 m
  # nearshore grid downsamples cleanly. The 2 m 2010 and 10 m bathy are interpolated up.
  cell_size_m: 1.0
  z_units: m                  # all sources converted to meters before mosaic
  nodata: -9999
  # Snap raster: leave null to snap to the highest-priority terrestrial source (2022).
  snap_raster: null
  # Output extent = boundary polygon (below) unioned with lake polygon, plus buffer.
  extent_buffer_m: 100
  # Test box [xmin, ymin, xmax, ymax] in target CRS meters, used by --test.
  # 4 x 4 km at Stateline on the south shore, straddling the 120th meridian
  # (easting ~760,000) so both 2022 halves, their seam, the 2010 lidar, the
  # green lidar, and the sonar all have data in the box. Flat urban land south of
  # ~4,314,500 for the land offset pairs, lake to the north.
  # Earlier box (Kings Beach, zone 10 only): [754500, 4344500, 758500, 4348500]
  test_extent: [758500, 4312000, 762500, 4316000]
  pixel_type: 32_BIT_FLOAT
  compression: LZW
  # Sanity range (m). Lake bottom ~1,397 m, Freel Peak 3,317 m. Anything outside is
  # a unit mistake or an unmasked NoData sentinel and gets nulled.
  plausible_z_m: [1300, 3400]

# ---------------------------------------------------------------------------
# Water-surface detection for terrestrial lidar (step 5). The lake polygon is
# eroded inward by offshore_erode_m so the sample contains no beach, then the
# median elevation of each terrestrial raster inside that core is its water
# surface, in its own datum. No gauge reading or LTD conversion involved.
# ---------------------------------------------------------------------------
cleaning:
  offshore_erode_m: 300
  sample_points: 20000

# ---------------------------------------------------------------------------
# Reference polygons. Can be SDE feature classes (read-only), REST layers exported
# to a local gdb, or shapefiles. Used to build the land/water priority zones.
# ---------------------------------------------------------------------------
boundaries:
  trpa_boundary: F:/GIS/DB_CONNECT/Vector.sde/SDE.Jurisdictions/SDE.TRPA_bdy
  # Lake polygon at legal max 6229.1 ft LTD. Used for the output extent and the
  # land/water zone split. Terrestrial lidar is NOT hard-masked by it; exposed beach
  # between the acquisition-date waterline and this polygon is kept.
  lake_high_water: F:/GIS/DB_CONNECT/Vector.sde/SDE.Water/SDE.LakeTahoe_At_HighWater
  # Optional: other hydro-flattened water bodies to exclude from terrestrial lidar
  # (Fallen Leaf, Cascade, Echo, Marlette, Spooner, reservoirs). Candidate:
  # F:/GIS/DB_CONNECT/Vector.sde/SDE.Water/SDE.Water_Bodies (408 polygons, includes
  # Lake Tahoe itself, so it would need a selection). Leave null to skip: without
  # bathy for those lakes, stripping only trades a flat surface for a hole.
  other_waterbodies: null

# ---------------------------------------------------------------------------
# Sources. Order here does NOT set priority (see priority block).
# vertical_offset_m: 'auto' takes the value solved in step 3 (see qa block); a
# number overrides it. It is ADDED to the source after unit conversion, in step 5.
# The reference source should stay at 0.0.
# water_strip_tol_m (terrestrial only): cells inside the lake polygon at or below
# detected water surface + this tolerance are nulled. Tight for a hydro-flattened
# product, wider for an un-flattened one where the surface is noisy.
# ---------------------------------------------------------------------------
# The 2022 lidar enters as two sources, one per UTM zone of the USGS OPR tiles
# (USGS_OPR_CA_SierraNevada_B22_be_*, 0.5 m, NAD83(2011), NAVD88). The previous
# single SDE raster was a 0.728 x 0.676 m cross-zone resample whose row/column
# moire hillshaded as terracing. Feeding the zones separately means each is
# resampled exactly once, here: west is a clean downsample in its own zone, east
# is one bilinear projection. Build the two mosaic datasets with
# scripts/build_2022_source.py, which prints these paths.
sources:
  lidar_2022_west:
    path: C:/GIS/lidar2022.gdb/opr_2022_utm10        # mosaic dataset of zone-10 tiles
    label: 2022 terrestrial LiDAR (USGS OPR, zone 10)
    type: terrestrial
    year: 2022
    native_cell_m: 0.5
    h_datum: NAD83(2011) UTM 10N (EPSG 6339)
    v_datum: NAVD88         # from the OPR tile vertical CRS; geoid model per USGS project report
    z_units: m
    vertical_offset_m: 0.0  # reference: defines the output vertical datum
    hydro_flattened: true   # USGS spec flattens large water bodies; the strip handles either case
    water_strip_tol_m: 0.15
    resampling: BILINEAR
    # The two work units are clipped at the 120th meridian with no overlap, and bilinear
    # resampling loses ~half a cell along every data edge, leaving a 1-2 cell strip that
    # neither half covers. Fill NoData within this many cells of data from the mean of valid
    # neighbours, before the water strip. 0 disables.
    edge_fill_cells: 2
    id: 1

  lidar_2022_east:
    path: C:/GIS/lidar2022.gdb/opr_2022_utm11        # mosaic dataset of zone-11 tiles
    label: 2022 terrestrial LiDAR (USGS OPR, zone 11)
    type: terrestrial
    year: 2022
    native_cell_m: 0.5
    h_datum: NAD83(2011) UTM 11N (EPSG 6340)
    v_datum: NAVD88
    z_units: m
    # 0.0 by construction: same product, same NAVD88 datum, same vendor processing as the west
    # half, and ProjectRaster does not touch elevations. The overlap strip between the two
    # zones' tiles is only metres wide, so measuring it is unreliable in a test box; the
    # east-vs-west pair stays in the offset chain as a diagnostic and the basin run reports
    # the measured difference along the whole seam. Set a number here only if that says so.
    vertical_offset_m: 0.0
    hydro_flattened: true
    water_strip_tol_m: 0.15
    # Bilinear, same as the west half. This half rotates ~4 degrees into zone 10 (Tahoe sits 3
    # degrees from each zone's central meridian), and a higher-order kernel would handle that
    # rotation slightly better. Cubic is not used because it overshoots at discontinuities, and
    # the hydro-flattened lake edge is a large one: overshoot above the water surface by more
    # than water_strip_tol_m would survive the strip as a rim of spurious shoreline cells.
    # Matching the west half also avoids a texture change across the zone seam, which crosses
    # land at the north and south shores. If the east half looks aliased in the test-box
    # hillshade, set CUBIC here and rerun step 2 for this source only.
    resampling: BILINEAR
    edge_fill_cells: 2      # see lidar_2022_west
    id: 5

  lidar_2022_1m:
    # Meridian patch. The OPR work units 5 and 8 are tiled so that two wedges along 120 W
    # (7.7 km2 over the north-central lake, 7.4 km2 on land south of the lake) fall in
    # neither; no other work unit has tiles there. USGS's seamless 1 m DEM for the same
    # project was built from the merged point cloud in each zone and holds real terrain
    # across both wedges (checked 2026-09-12 on tile x76y431: 6.58 km2 of the south wedge,
    # 100 percent valid). Ten zone-10 1 m tiles (x75-x76, y431-y435, 1.28 GB) are listed in
    # data/usgs_2022_1m_wedge_patch_urls.txt. Ranked just below the two OPR halves so it
    # fills only what they lack. Same project, datum, and geoid as the OPR tiles.
    path: C:/GIS/lidar2022.gdb/usgs1m_2022_utm10    # mosaic dataset of the ten 1 m tiles
    label: 2022 USGS 3DEP 1 m seamless DEM (meridian patch)
    type: terrestrial
    year: 2022
    native_cell_m: 1.0
    h_datum: NAD83 UTM 10N (EPSG 26910, as labelled in the 1 m tiles)
    v_datum: NAVD88 (GEOID18, same project as the OPR tiles)
    z_units: m
    vertical_offset_m: auto     # solved against the zone-10 OPR half; expect ~0
    hydro_flattened: true
    water_strip_tol_m: 0.15
    resampling: BILINEAR
    edge_fill_cells: 0
    id: 6

  lidar_2010:
    path: F:/GIS/DB_CONNECT/Raster.sde/SDE.DEM_BareEarth_LiDAR_2010
    label: 2010 terrestrial LiDAR
    type: terrestrial
    year: 2010
    native_cell_m: 2.0      # from file
    h_datum: NAD83 UTM 10N (EPSG 26910)   # from file
    v_datum: NAVD88 (geoid model not stated; OpenTopography record, doi 10.5069/G9PN93H2)
    z_units: m              # from value range (1,881 to 3,317)
    vertical_offset_m: auto
    hydro_flattened: true   # single constant elevation over the lake
    water_strip_tol_m: 0.15
    id: 2

  green_2020:
    # Key kept as green_2020 (it is referenced throughout); the survey is 2018. SDE metadata:
    # "Bare Earth Digital Elevation Model - Nearshore Lake Tahoe - 2018", Quantum Spatial for
    # Spatial Informatics Group under TRPA contract, Riegl VQ-880-G (532 nm) in a Cessna
    # Caravan, flown 2018-09-09 to 2018-09-16, NAD83(2011) UTM 10N, NAVD88 GEOID12B, 0.5 m.
    path: F:/GIS/DB_CONNECT/Raster.sde/SDE.Nearshore_BareEarth_DEM
    label: 2018 topobathymetric (green) LiDAR
    type: topobathy
    year: 2018
    native_cell_m: 0.5      # from file
    h_datum: NAD83(2011) UTM 10N (stored as NAD83 UTM 10N, EPSG 26910)
    v_datum: NAVD88 (GEOID12B)   # per SDE metadata; the -0.06 m offset vs 2022 (GEOID18) matches a geoid-model difference
    z_units: m              # from value range (1,885 to 2,042). Min is only ~13 m below lake level.
    vertical_offset_m: auto
    hydro_flattened: false
    # Optional absolute elevation floor (m). Bottom returns near the penetration
    # limit get noisy/sparse; null cells below this so the sonar takes over.
    # File min is 1,884.6 m. null = keep all valid.
    floor_elev_m: null
    id: 3

  sonar_1999:
    # This SDE raster is a USGS bathy + topo merge in FEET on UTM 11N (max 10,052 ft is a
    # mountain, min 4,593 ft is the lake floor). The topo skin never competes: type bathy is
    # clipped to the lake polygon in the cleaning step.
    path: F:/GIS/DB_CONNECT/Raster.sde/SDE.DEM_USGS_DeepWaterBathyTopo
    label: 1999 USGS multibeam sonar bathymetry
    type: bathy
    year: 1999
    native_cell_m: 10.0     # from file
    h_datum: NAD83 UTM 11N (EPSG 26911)   # from file. Different zone from the others.
    # USGS DDS-55 v1.0 (Dartnell and Gardner, 1999), 10 m grid of the Aug 1998 EM1000
    # multibeam survey. Basin runs: topo skin vs 2022 lidar on low-slope land = -1.19 m
    # (old 2022 raster) and -0.85 m (OPR tiles), IQR 4.5 m either way, i.e. an NGVD29-era
    # reference resolved only to ~0.5 m. The solved offset assumes the bathy half shares
    # the skin's reference; the shelf diagnostic cannot confirm it because the 0-13 m band
    # diverges from the 2018 green lidar with depth (~3 m per 10 m) for reasons the product
    # does not document (interpolation, or the 2000 SHOALS merge). Worst case ~1 m in deep water.
    v_datum: NGVD29-era lake reference (inferred; skin -0.85 m vs 2022 NAVD88 on land)
    z_units: ft             # from value range (4,593 to 10,053)
    vertical_offset_m: auto
    hydro_flattened: false
    # Focal smoothing before upsampling to hide track-line artifacts. null = off.
    smooth_window_cells: 3
    id: 4

# ---------------------------------------------------------------------------
# Priority. First valid (non-NoData) source wins, per zone.
#   land  = inside TRPA boundary, outside high-water polygon
#   water = inside high-water polygon
# Terrestrial sources inside "water" are still valid on exposed beach above the
# acquisition-date waterline; the water-surface strip handles the rest.
# ---------------------------------------------------------------------------
priority:
  land:  [lidar_2022_west, lidar_2022_east, lidar_2022_1m, lidar_2010, green_2020, sonar_1999]
  water: [green_2020, lidar_2022_west, lidar_2022_east, lidar_2022_1m, lidar_2010, sonar_1999]

# Seam feathering. Blends the winning source into the runner-up over this
# distance (m) from the winner's data edge. 0 = hard cutlines.
# Set to 100 after the Kings Beach test showed sonar-vs-green scatter of
# IQR 1.3-1.9 m with no depth trend: the handoff at the green lidar's depth
# limit needs a ramp, not a step. Costs one Euclidean distance pass per source.
blend:
  # 300 m: the green-to-sonar handoff at ~13 m depth is a 2-3 m step where the
  # 1999 grid is interpolated fill. Over 300 m that becomes a ~1 percent ramp,
  # a slope rather than a ledge. It is a compromise over a zone with no good data.
  feather_m: 300
  # Zones whose priority chain gets feathered. Land is left out: 2022 and 2010
  # agree within 5 cm, so feathering there only costs distance passes.
  feather_zones: [water]

# ---------------------------------------------------------------------------
# Vertical datum reconciliation (step 3). The reference source defines the output
# vertical datum. Each [source, against] pair in offset_chain is solved in order:
# offset(source) = offset(against) - median(source - against) over stable ground,
# so 'against' must be the reference or already solved. Results go to
# outputs/resolved_offsets.yaml and are picked up by every source whose
# vertical_offset_m is 'auto'.
#
# Why this chain: 2010 and 2022 share most of the land. The green lidar has a
# topo skin, so it aligns to 2022 on beaches and low-slope shore land. The USGS
# product also has a topo skin, so its datum is solved on land against 2022.
# Its bathy vs the green lidar in the 0-13 m band is kept as a diagnostic only:
# the basin run showed the difference growing ~2.7 m per 10 m of depth (flat at
# Kings Beach), i.e. the 1999 grid is interpolated fill in most of that band and
# an offset measured there would be measured against fill, not data.
# A third element "diagnostic" reports a pair without using it to set an offset.
# ---------------------------------------------------------------------------
qa:
  reference: lidar_2022_west
  offset_chain:
    # East vs west is the same product in two zones; expect ~0. A large value means
    # a projection or realization problem, not a datum difference.
    - [lidar_2022_east, lidar_2022_west, diagnostic]   # same product in two zones; offset fixed at 0
    # The 1 m patch overlaps the zone-10 OPR half by ~10 km on each side of the meridian, so
    # this pair has thousands of usable points. Same project and datum: expect ~0. A real
    # shift here would mean USGS's 1 m product differs from the OPR, which we would want to know.
    - [lidar_2022_1m, lidar_2022_west]
    - [lidar_2010, lidar_2022_west]
    - [green_2020, lidar_2022_west]
    - [sonar_1999, lidar_2022_west]
    - [sonar_1999, green_2020, diagnostic]
  sample_points: 20000    # initial random points over each pair's overlap bounding box
  max_sample_points: 500000  # grown x5 at a time until min_samples are usable, up to this
  max_slope_deg: 10       # land pairs only: steep ground turns horizontal misregistration into vertical error
  min_samples: 500        # fewer usable samples than this -> offset left unsolved
  keep_diff_rasters: false  # true keeps the ~9 GB dm_diff_* rasters after step 3 for viewing a TILT in Pro
  diff_flag_m: 0.5        # LARGE_SHIFT flag when |median| exceeds this
  tilt_flag_m_per_km: 0.05  # TILT flag when the fitted plane slopes more than this (basin-wide 0.004 is noise)

# ---------------------------------------------------------------------------
# Metadata (scripts/write_metadata.py). Numbers (offsets, areas, seam stats,
# extent, dates) are read from the run outputs; this block holds the human parts.
# ---------------------------------------------------------------------------
metadata:
  title: Lake Tahoe Basin Bare-Earth DEM, 1 meter (2026 mosaic)
  organization: Tahoe Regional Planning Agency (TRPA)
  contact_name: Mason Bindl
  contact_email: gis@trpa.gov
  contact_phone: null
  publish_date: "2026-09-12"   # date of the basin build from the OPR sources
  # Vertical datum statement for the product: the 2022 lidar's datum.
  vertical_datum: NAVD88 (EPSG 5703), GEOID18, inherited from the 2022 USGS OPR bare-earth tiles (CA_SierraNevada_B22 project report, 2024-10-25)
  credits: >
    Tahoe Regional Planning Agency. Source data: U.S. Geological Survey 3D Elevation Program
    CA_SierraNevada_B22 lidar (NV5 Geospatial, 2021-2022); Lake Tahoe Basin lidar (Watershed
    Sciences, 2010, for TRPA and USGS); Lake Tahoe nearshore topobathymetric lidar (Quantum
    Spatial for Spatial Informatics Group and TRPA, 2018); and USGS Lake Tahoe multibeam
    bathymetry (Dartnell and Gardner, 1999, DDS-55; Gardner and others, 1998, 1999).
  # One paragraph per source for the lineage section. Settled 2026-09-12 from the USGS 3DEP
  # project report, OpenTopography, the SDE rasters' own metadata, and USGS publication records.
  source_citations:
    lidar_2022_west: >
      U.S. Geological Survey 3D Elevation Program, lidar project CA_SierraNevada_B22, work units
      CA_SierraNevada_5_2022_TahoeWest (USGS work unit 300245, collected 2021-11-12 to 2022-08-22)
      and CA_SierraNevada_6_2022 (300246, 2021-11-03 to 2022-08-19). Collected by NV5 Geospatial,
      Inc. under a USGS GPSC contract with Riegl VQ-1560ii and Leica TerrainMapper sensors, Quality
      Level 1, Lidar Base Specification 2022 rev. A. Original product resolution (OPR) bare-earth
      DEM tiles, 0.5 m, hydro-flattened, NAD83(2011) UTM zone 10N (EPSG 6339), NAVD88 (EPSG 5703)
      with GEOID18. Project-level tested DEM accuracy: non-vegetated RMSEz 5.04 cm, 9.88 cm at
      95 percent confidence; vegetated 24.69 cm at the 95th percentile. USGS project report dated
      2024-10-25, https://rockyweb.usgs.gov/vdelivery/Datasets/Staged/Elevation/metadata/CA_SierraNevada_B22/USGS_CA_SierraNevada_B22_Project_Report.pdf
    lidar_2022_east: >
      U.S. Geological Survey 3D Elevation Program, lidar project CA_SierraNevada_B22, work unit
      CA_SierraNevada_8_2022_TahoeEast (USGS work unit 300363, collected 2021-11-18 to 2022-08-25).
      Collected by NV5 Geospatial, Inc. under a USGS GPSC contract with Riegl VQ-1560ii and Leica
      TerrainMapper sensors, Quality Level 1, Lidar Base Specification 2022 rev. A. OPR bare-earth
      DEM tiles, 0.5 m, hydro-flattened, NAD83(2011) UTM zone 11N (EPSG 6340), NAVD88 (EPSG 5703)
      with GEOID18; projected once to UTM zone 10N by this pipeline. Project-level tested DEM
      accuracy: non-vegetated RMSEz 5.04 cm, 9.88 cm at 95 percent confidence; vegetated 24.69 cm
      at the 95th percentile. Same project report as the zone-10 half.
    lidar_2022_1m: >
      U.S. Geological Survey 3D Elevation Program, one-meter digital elevation model, project
      CA_SierraNevada_B22, UTM zone 10N tiles x75 to x76, y431 to y435 (USGS_1M_10_*_CA_SierraNevada_B22.tif),
      published 2025-05-15. Generated by USGS from the project's classified lidar point cloud at
      1 m, NAD83 UTM zone 10N, NAVD88; same acquisition (NV5 Geospatial, 2021-11 to 2022-08),
      datum, and GEOID18 as the OPR tiles. Used only where the OPR work units 5 and 8 leave
      wedge-shaped gaps along the 120th meridian, which the 1 m product covers with continuous
      terrain. https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1m/Projects/CA_SierraNevada_B22/
    lidar_2010: >
      Watershed Sciences, Inc., 2010, Lake Tahoe Basin LiDAR: airborne lidar collected 2010-08-11
      to 2010-08-24 with two Leica ALS50 Phase II sensors under a contract administered by the
      Tahoe Regional Planning Agency and the U.S. Geological Survey. Average first-return density
      11.82 points per square meter, ground 2.26; reported vertical accuracy 3.5 cm RMSE.
      Hydro-enforced bare-earth DEM, 0.5 m, NAD83 UTM zone 10N (EPSG 26910), NAVD88 (EPSG 5703);
      geoid model not stated in the distribution record. TRPA holds a 2 m derivative in its
      enterprise geodatabase. Distributed by OpenTopography, https://doi.org/10.5069/G9PN93H2
    green_2020: >
      Quantum Spatial, Inc., 2018, Lake Tahoe nearshore topobathymetric lidar: Riegl VQ-880-G
      green-wavelength (532 nm) lidar flown 2018-09-09 to 2018-09-16 in a Cessna Caravan for
      Spatial Informatics Group under contract to the Tahoe Regional Planning Agency, acquired
      to support aquatic invasive species mapping and mooring permitting. Bare-earth DEM, 0.5 m,
      from integrated green and near-infrared returns (TIN of ground and bathymetric bottom
      points), clipped to avoid triangulation across data gaps. NAD83(2011) UTM zone 10N,
      NAVD88 with GEOID12B. Source: TRPA enterprise geodatabase metadata for
      SDE.Nearshore_BareEarth_DEM and Nearshore_LiDAR_Derivatives.gdb.
    sonar_1999: >
      Dartnell, P., and Gardner, J.V., 1999, Sea-floor images and data from multibeam surveys in
      San Francisco Bay, Southern California, Hawaii, the Gulf of Mexico, and Lake Tahoe,
      California-Nevada: U.S. Geological Survey Digital Data Series DDS-55, version 1.0,
      https://pubs.usgs.gov/dds/dds-55/. Lake Tahoe bathymetry gridded at 10 m from the
      1998-08-02 to 1998-08-17 Kongsberg Simrad EM1000 multibeam survey aboard RV Inland
      Surveyor (Gardner, J.V., Mayer, L.A., and Hughes Clarke, J.E., 1998, USGS Open-File Report
      98-509, https://doi.org/10.3133/ofr98509; map: Gardner, Dartnell, Mayer, and Hughes Clarke,
      1999, USGS Water-Resources Investigations Report 99-4043). The copy in TRPA's enterprise
      geodatabase (SDE.DEM_USGS_DeepWaterBathyTopo) is a bathymetry-plus-land-topography merge in
      feet on NAD83 UTM zone 11N with no embedded metadata. Its vertical reference is not
      documented and was reconciled empirically: the topographic skin sits 0.85 m below the 2022
      NAVD88 lidar on stable ground, consistent with an NGVD29-era reference. USGS also released
      a merge with July 2000 U.S. Army Corps of Engineers SHOALS lidar covering the shoreline to
      about 15 m depth; whether this copy includes it is not documented.
  use_limitations: >
    Not for navigation. The nearshore band from roughly the 2018 topobathymetric lidar's depth
    limit (about 13 m) outward is transitional. Shallower than that, the 1998 USGS grid disagrees
    with the 2018 lidar by an amount that grows with depth (about 3 m per 10 m); whether that
    band of the grid is interpolated or older lidar is not documented. The mosaic prefers the
    2018 lidar there and ramps between the two sources over 300 m, and elevations in the ramp
    may be in error by several meters. The deep lake is 10 m sonar data resampled to 1 m; the
    1 m cell size does not imply 1 m detail there. Consult the companion source-ID raster to
    identify which source informs any cell. The vertical reference of the bathymetric source
    was inferred, not documented; absolute deep-water elevations carry roughly 1 m uncertainty.

outputs:
  # COG GeoTIFFs cannot live inside a gdb, so final products go to a folder beside Scratch.gdb
  dir: C:/GIS/dem-mosaic
  dem: tahoe_dem_mosaic_1m.tif
  source_id: tahoe_dem_mosaic_source.tif
  hillshade: tahoe_dem_mosaic_hs.tif
